# Jellyfish 官方 MCP 客户端插件（PF4J 描述符，必须位于插件 jar 根目录）
#
# plugin.id 同时是注册表的 owner：插件卸载时按它批量回收工具、权限拦截与命令。
plugin.id=jellyfish-mcp
plugin.class=zcd.jellyfish.plugin.mcp.McpPlugin
plugin.version=0.0.1
plugin.provider=zcd
plugin.description=MCP 客户端：stdio 连接 MCP server，工具以 mcp__<server>__<tool> 形式接入

# 内核版本号是 0.0.1-SNAPSHOT，不是合法 semver，只能写通配。
plugin.requires=*

jellyfish.tags=mcp,tools,integration

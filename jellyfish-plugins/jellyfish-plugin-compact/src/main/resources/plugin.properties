# Jellyfish 官方压缩插件（PF4J 描述符，必须位于插件 jar 根目录）
#
# plugin.id 同时是注册表的 owner：插件卸载时按它批量回收压缩策略贡献。
# 它也是 jellyfish.json 里 plugins.enabled / plugins.configurations 使用的名字：
# 不启用本插件时，会话压缩（含自动压缩）整体不可用，/compact 会直接告诉用户这一条。
plugin.id=jellyfish-compact
plugin.class=zcd.jellyfish.plugin.compact.CompactPlugin
plugin.version=0.0.1
plugin.provider=zcd
plugin.description=会话压缩：把更早的对话压成摘要的策略（摘要指令 + 保留条数与摘要上限）

# 内核版本号是 0.0.1-SNAPSHOT，不是合法 semver，只能写通配。
plugin.requires=*

jellyfish.tags=compact,context,summary

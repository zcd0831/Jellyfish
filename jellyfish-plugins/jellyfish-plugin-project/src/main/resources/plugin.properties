# Jellyfish 官方项目约定插件（PF4J 描述符，必须位于插件 jar 根目录）
#
# plugin.id 同时是注册表的 owner：插件卸载时按它批量回收提示词贡献。
plugin.id=jellyfish-project
plugin.class=zcd.jellyfish.plugin.project.ProjectPlugin
plugin.version=0.0.1
plugin.provider=zcd
plugin.description=项目约定：探测工作目录下的 AGENTS.md，并在 system prompt 里给出路径指引

# 内核兼容约束刻意写 *：内核版本号是 0.0.1-SNAPSHOT，不是合法 semver，
# 写具体版本会被预检归一为 * 并记一条描述符错误，反而让插件启动不了。
plugin.requires=*

# 标签仅作诊断与展示。
jellyfish.tags=project,conventions,prompt

# Jellyfish 官方 skills 插件（PF4J 描述符，必须位于插件 jar 根目录）
#
# plugin.id 同时是注册表的 owner：插件卸载时按它批量回收工具、提示词贡献与命令。
plugin.id=jellyfish-skills
plugin.class=zcd.jellyfish.plugin.skills.SkillsPlugin
plugin.version=0.0.1
plugin.provider=zcd
plugin.description=skills：发现 SKILL.md 目录，元信息进 system prompt，正文由模型按需加载

# 内核版本号是 0.0.1-SNAPSHOT，不是合法 semver，只能写通配。
plugin.requires=*

jellyfish.tags=skills,prompt,context

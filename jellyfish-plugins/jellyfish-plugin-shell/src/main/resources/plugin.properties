# Jellyfish 官方命令行插件（PF4J 描述符，必须位于插件 jar 根目录）
#
# plugin.id 同时是注册表的 owner：插件卸载时按它批量回收工具与权限处理器注册。
plugin.id=jellyfish-shell
plugin.class=zcd.jellyfish.plugin.shell.ShellPlugin
plugin.version=0.0.1
plugin.provider=zcd
plugin.description=执行 shell 命令（输出由内核捕获与落盘）

# 内核兼容约束刻意写 *：内核版本号是 0.0.1-SNAPSHOT，不是合法 semver，
# 写具体版本会被预检归一为 * 并记一条描述符错误，反而让插件启动不了。
plugin.requires=*

# 标签仅作诊断与展示；agent 授权只按工具名，不按标签。
jellyfish.tags=shell,exec
